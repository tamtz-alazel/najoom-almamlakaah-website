# نجوم المملكة

موقع إلكتروني احترافي ومتجاوب لشركة نجوم المملكة في الرياض، يقدم خدمات كشف التسربات، العزل، تنظيف الخزانات، مكافحة الحشرات، وتسليك المجاري.

## التشغيل

افتح ملف `index.html` مباشرة في المتصفح، أو استضف المشروع على أي خادم ثابت.

## المكونات

- HTML5
- CSS3
- JavaScript
- RTL عربي
- Mobile First
- أزرار واتساب واتصال مباشرة
- نموذج طلب خدمة يفتح واتساب برسالة تلقائية

